<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PouMusic</title>


    <style>

        /* =====================================================
           Global
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        :root {

            --bg: #101114;

            --card: rgba(255, 255, 255, 0.08);

            --card-hover: rgba(255, 255, 255, 0.13);

            --text: #ffffff;

            --subtext: rgba(255, 255, 255, 0.55);

            --line: rgba(255, 255, 255, 0.1);

            --accent: #ffffff;

        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;

        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);


            /* =================================================
               Static Background
               不再跟随音乐变化
            ================================================= */

            background:

                radial-gradient(
                    circle at 15% 10%,
                    rgba(120, 100, 255, 0.10),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 85% 85%,
                    rgba(0, 180, 255, 0.07),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 50% 50%,
                    rgba(255, 255, 255, 0.025),
                    transparent 50%
                ),

                #101114;


            display: flex;

            justify-content: center;

            align-items: center;


            padding: 40px 20px;

        }


        /* =====================================================
           Main
        ===================================================== */

        .app {

            width: 100%;

            max-width: 900px;

        }


        .header {

            margin-bottom: 22px;

        }


        .title {

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -0.5px;

        }


        .subtitle {

            margin-top: 6px;

            color: var(--subtext);

            font-size: 14px;

        }


        /* =====================================================
           Player
        ===================================================== */

        .player {

            position: sticky;

            top: 20px;

            z-index: 10;


            padding: 22px;


            border:

                1px solid

                rgba(255, 255, 255, 0.11);


            border-radius: 24px;


            /* =================================================
               Glass / Gaussian Blur
            ================================================= */

            background:

                linear-gradient(
                    135deg,
                    rgba(35, 36, 42, 0.72),
                    rgba(20, 21, 25, 0.58)
                );


            backdrop-filter:

                blur(28px)

                saturate(130%);


            -webkit-backdrop-filter:

                blur(28px)

                saturate(130%);


            box-shadow:

                0 20px 60px

                rgba(0, 0, 0, 0.38);


            margin-bottom: 20px;


            overflow: hidden;

        }


        /* 顶部玻璃高光 */

        .player::before {

            content: "";

            position: absolute;

            left: 0;

            top: 0;

            width: 100%;

            height: 1px;


            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.35),
                    transparent
                );

            opacity: 0.7;

        }


        .now-playing {

            display: flex;

            align-items: center;

            gap: 16px;

        }


        /* =====================================================
           Album
        ===================================================== */

        .album {

            width: 64px;

            height: 64px;


            flex-shrink: 0;


            border-radius: 16px;


            display: flex;

            justify-content: center;

            align-items: center;


            font-size: 26px;


            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.18),
                    rgba(255,255,255,0.04)
                );


            border:

                1px solid

                rgba(255,255,255,0.1);


            box-shadow:

                inset 0 1px 0

                rgba(255,255,255,0.08),

                0 10px 30px

                rgba(0,0,0,0.15);

        }


        /* =====================================================
           Track Info
        ===================================================== */

        .track-info {

            min-width: 0;

            flex: 1;

        }


        .track-name {

            font-size: 18px;

            font-weight: 600;


            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .track-source {

            margin-top: 4px;

            font-size: 13px;

            color: var(--subtext);

        }


        /* =====================================================
           Controls
        ===================================================== */

        .controls {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 20px;

        }


        button {

            border: none;

            outline: none;


            color: white;


            cursor: pointer;


            font-family: inherit;


            transition:

                transform 0.15s ease,

                background 0.15s ease,

                opacity 0.15s ease;

        }


        button:hover {

            transform: translateY(-1px);

        }


        button:active {

            transform: scale(0.95);

        }


        .control-btn {

            width: 42px;

            height: 42px;


            border-radius: 50%;


            background:

                rgba(255,255,255,0.08);

        }


        .control-btn:hover {

            background:

                rgba(255,255,255,0.14);

        }


        /* =====================================================
           Play Button
        ===================================================== */

        .play-btn {

            width: 50px;

            height: 50px;


            border-radius: 50%;


            background: white;

            color: #111;


            font-size: 19px;


            box-shadow:

                0 5px 20px

                rgba(255,255,255,0.08);

        }


        .play-btn:hover {

            box-shadow:

                0 5px 25px

                rgba(255,255,255,0.18);

        }


        /* =====================================================
           Progress Container
        ===================================================== */

        .progress-container {

            position: relative;


            flex: 1;


            height: 6px;


            border-radius: 10px;


            background:

                rgba(255,255,255,0.10);


            cursor: pointer;


            overflow: hidden;


            box-shadow:

                inset 0 1px 2px

                rgba(0,0,0,0.25);

        }


        /* =====================================================
           Progress Bar
           渐变 + 流光
        ===================================================== */

        .progress {

            position: relative;


            width: 0%;

            height: 100%;


            border-radius: inherit;


            background:

                linear-gradient(
                    90deg,
                    #7c5cff,
                    #00c6ff,
                    #00e5ff,
                    #7c5cff
                );


            background-size: 250% 100%;


            box-shadow:

                0 0 8px

                rgba(0, 210, 255, 0.45),

                0 0 16px

                rgba(124, 92, 255, 0.25);


            transition:

                width 0.12s linear;

        }


        /* =====================================================
           Progress 流光
        ===================================================== */

        .progress::after {

            content: "";


            position: absolute;


            top: 0;

            bottom: 0;


            width: 80px;


            right: -80px;


            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.75),
                    transparent
                );


            filter:

                blur(3px);


            opacity: 0;


            pointer-events: none;

        }


        /* 播放时流光 */

        .player.playing .progress {

            animation:

                progressGradient 4s linear infinite;

        }


        .player.playing .progress::after {

            animation:

                progressShine 2.2s linear infinite;

            opacity: 1;

        }


        @keyframes progressGradient {

            0% {

                background-position: 0% 50%;

            }

            100% {

                background-position: 250% 50%;

            }

        }


        @keyframes progressShine {

            0% {

                right: 100%;

            }

            100% {

                right: -80px;

            }

        }


        /* =====================================================
           Progress Hover
        ===================================================== */

        .progress-container:hover {

            height: 7px;

        }


        .progress-container:hover .progress {

            box-shadow:

                0 0 10px

                rgba(0, 220, 255, 0.65),

                0 0 22px

                rgba(124, 92, 255, 0.35);

        }


        /* =====================================================
           Time
        ===================================================== */

        .time {

            min-width: 85px;


            text-align: right;


            font-size: 12px;


            color: var(--subtext);


            font-variant-numeric:

                tabular-nums;

        }


        /* =====================================================
           Volume
        ===================================================== */

        .volume {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .volume-icon {

            color:

                rgba(255,255,255,0.5);

            font-size: 14px;

        }


        input[type="range"] {

            width: 90px;

            height: 4px;


            appearance: none;

            -webkit-appearance: none;


            border-radius: 10px;


            background:

                rgba(255,255,255,0.1);


            cursor: pointer;

        }


        input[type="range"]::-webkit-slider-thumb {

            appearance: none;

            -webkit-appearance: none;


            width: 12px;

            height: 12px;


            border-radius: 50%;


            background: white;


            cursor: pointer;


            box-shadow:

                0 0 8px

                rgba(255,255,255,0.25);

        }


        input[type="range"]::-moz-range-thumb {

            width: 12px;

            height: 12px;


            border: none;


            border-radius: 50%;


            background: white;


            cursor: pointer;

        }


        /* =====================================================
           Playlist
        ===================================================== */

        .playlist {

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        .song {

            display: flex;

            align-items: center;


            padding: 13px 15px;


            border-radius: 15px;


            background:

                rgba(255,255,255,0.035);


            border:

                1px solid transparent;


            cursor: pointer;


            transition:

                background 0.15s ease,

                border-color 0.15s ease,

                transform 0.15s ease;

        }


        .song:hover {

            background:

                var(--card-hover);


            transform:

                translateX(2px);

        }


        .song.active {

            background:

                var(--card);


            border-color:

                var(--line);

        }


        .song-number {

            width: 35px;


            color:

                rgba(255,255,255,0.35);


            font-size: 13px;


            font-variant-numeric:

                tabular-nums;

        }


        .song-icon {

            width: 34px;

            height: 34px;


            border-radius: 10px;


            background:

                rgba(255,255,255,0.07);


            display: flex;

            align-items: center;

            justify-content: center;


            margin-right: 12px;


            font-size: 15px;

        }


        .song-info {

            flex: 1;

            min-width: 0;

        }


        .song-title {

            font-size: 14px;

            font-weight: 500;


            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .song-type {

            margin-top: 2px;


            color:

                var(--subtext);


            font-size: 11px;

        }


        .song-play {

            color:

                rgba(255,255,255,0.45);


            font-size: 14px;

        }


        /* =====================================================
           Footer
        ===================================================== */

        .footer {

            margin-top: 20px;


            text-align: center;


            color:

                rgba(255,255,255,0.3);


            font-size: 12px;

        }


        /* =====================================================
           Mobile
        ===================================================== */

        @media (max-width: 600px) {

            body {

                padding:

                    20px 12px;

            }


            .player {

                padding: 16px;

                border-radius: 20px;

            }


            .title {

                font-size: 25px;

            }


            .album {

                width: 55px;

                height: 55px;

            }


            .time {

                display: none;

            }


            .volume {

                display: none;

            }


            .song {

                padding: 12px;

            }


            .controls {

                gap: 7px;

            }


            .progress-container {

                min-width: 40px;

            }

        }


    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         Header
    ===================================================== -->

    <div class="header">

        <div class="title">
            PouMusic
        </div>

        <div class="subtitle">
            Music collection
        </div>

    </div>


    <!-- =====================================================
         Player
    ===================================================== -->

    <div
        class="player"
        id="player"
    >


        <div class="now-playing">


            <div class="album">
                ♪
            </div>


            <div class="track-info">


                <div
                    class="track-name"
                    id="trackName"
                >
                    Select a song
                </div>


                <div
                    class="track-source"
                    id="trackSource"
                >
                    PouMusic
                </div>


            </div>


        </div>


        <div class="controls">


            <!-- Previous -->

            <button
                class="control-btn"
                id="prevBtn"
                title="Previous"
            >
                ‹
            </button>


            <!-- Play -->

            <button
                class="play-btn"
                id="playBtn"
                title="Play"
            >
                ▶
            </button>


            <!-- Next -->

            <button
                class="control-btn"
                id="nextBtn"
                title="Next"
            >
                ›
            </button>


            <!-- Progress -->

            <div
                class="progress-container"
                id="progressContainer"
            >

                <div
                    class="progress"
                    id="progress"
                ></div>

            </div>


            <!-- Time -->

            <div
                class="time"
                id="time"
            >
                0:00 / 0:00
            </div>


            <!-- Volume -->

            <div class="volume">

                <span class="volume-icon">
                    🔊
                </span>


                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                >

            </div>


        </div>


    </div>


    <!-- =====================================================
         Playlist
    ===================================================== -->

    <div
        class="playlist"
        id="playlist"
    ></div>


    <!-- =====================================================
         Footer
    ===================================================== -->

    <div class="footer">
        PouMusic
    </div>


</div>


<!-- =========================================================
     Audio
========================================================= -->

<audio id="audio"></audio>


<script>


    /* =========================================================
       Music List
    ========================================================= */

    const songs = [

        {
            name: "Carefun",
            file: "Carefun.ogg"
        },

        {
            name: "Cheerful",
            file: "Cheerful.ogg"
        },

        {
            name: "Chill",
            file: "Chill.ogg"
        },

        {
            name: "Forest",
            file: "Forest.ogg"
        },

        {
            name: "Guess",
            file: "Guess.ogg"
        },

        {
            name: "Happy",
            file: "Happy.ogg"
        },

        {
            name: "Hill",
            file: "Hill.wav"
        },

        {
            name: "Hop",
            file: "Hop.ogg"
        },

        {
            name: "IX",
            file: "IX.mp3"
        },

        {
            name: "Jolly",
            file: "Jolly.ogg"
        },

        {
            name: "Popper",
            file: "Popper.ogg"
        },

        {
            name: "Soft",
            file: "Soft.ogg"
        },

        {
            name: "Swap",
            file: "Swap.ogg"
        },

        {
            name: "Think",
            file: "Think.ogg"
        },

        {
            name: "Tropical",
            file: "Tropical.ogg"
        },

        {
            name: "War 3",
            file: "War_3.wav"
        }

    ];


    /* =========================================================
       Configuration
    ========================================================= */

    const MUSIC_PATH = "PouMusic/";


    /* =========================================================
       Elements
    ========================================================= */

    const audio =
        document.getElementById("audio");


    const player =
        document.getElementById("player");


    const playBtn =
        document.getElementById("playBtn");


    const prevBtn =
        document.getElementById("prevBtn");


    const nextBtn =
        document.getElementById("nextBtn");


    const progress =
        document.getElementById("progress");


    const progressContainer =
        document.getElementById(
            "progressContainer"
        );


    const trackName =
        document.getElementById(
            "trackName"
        );


    const trackSource =
        document.getElementById(
            "trackSource"
        );


    const time =
        document.getElementById("time");


    const volume =
        document.getElementById("volume");


    const playlist =
        document.getElementById("playlist");


    /* =========================================================
       State
    ========================================================= */

    let currentIndex = 0;


    /* =========================================================
       Format Time
    ========================================================= */

    function formatTime(seconds) {

        if (!isFinite(seconds)) {

            return "0:00";

        }


        const minutes =
            Math.floor(seconds / 60);


        const secs =
            Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");


        return `${minutes}:${secs}`;

    }


    /* =========================================================
       Load Song
    ========================================================= */

    function loadSong(
        index,
        autoplay = false
    ) {

        currentIndex = index;


        const song =
            songs[currentIndex];


        audio.src =
            MUSIC_PATH + song.file;


        trackName.textContent =
            song.name;


        trackSource.textContent =
            "PouMusic · " +
            song.file
                .split(".")
                .pop()
                .toUpperCase();


        /* 重置进度 */

        progress.style.width =
            "0%";


        time.textContent =
            "0:00 / 0:00";


        updatePlaylist();


        if (autoplay) {

            audio.play()

                .then(() => {

                    updatePlayButton();

                })

                .catch(error => {

                    console.log(error);

                });

        }

        else {

            updatePlayButton();

        }

    }


    /* =========================================================
       Playlist
    ========================================================= */

    function createPlaylist() {

        playlist.innerHTML = "";


        songs.forEach(
            (song, index) => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "song";


                item.dataset.index =
                    index;


                item.innerHTML = `

                    <div class="song-number">
                        ${String(index + 1).padStart(2, "0")}
                    </div>

                    <div class="song-icon">
                        ♪
                    </div>

                    <div class="song-info">

                        <div class="song-title">
                            ${song.name}
                        </div>

                        <div class="song-type">
                            ${song.file
                                .split(".")
                                .pop()
                                .toUpperCase()}
                        </div>

                    </div>

                    <div class="song-play">
                        ▶
                    </div>

                `;


                item.addEventListener(
                    "click",
                    () => {

                        loadSong(
                            index,
                            true
                        );

                    }
                );


                playlist.appendChild(
                    item
                );

            }
        );


        updatePlaylist();

    }


    /* =========================================================
       Update Playlist
    ========================================================= */

    function updatePlaylist() {

        const items =
            playlist.querySelectorAll(
                ".song"
            );


        items.forEach(
            (item, index) => {

                if (
                    index ===
                    currentIndex
                ) {

                    item.classList.add(
                        "active"
                    );

                }

                else {

                    item.classList.remove(
                        "active"
                    );

                }

            }
        );

    }


    /* =========================================================
       Play / Pause
    ========================================================= */

    function togglePlay() {

        if (!audio.src) {

            loadSong(
                currentIndex,
                true
            );

            return;

        }


        if (audio.paused) {

            audio.play();

        }

        else {

            audio.pause();

        }

    }


    /* =========================================================
       Update Play Button
    ========================================================= */

    function updatePlayButton() {

        if (audio.paused) {

            playBtn.textContent =
                "▶";


            player.classList.remove(
                "playing"
            );

        }

        else {

            playBtn.textContent =
                "Ⅱ";


            player.classList.add(
                "playing"
            );

        }

    }


    /* =========================================================
       Previous
    ========================================================= */

    function previousSong() {

        currentIndex--;


        if (
            currentIndex < 0
        ) {

            currentIndex =
                songs.length - 1;

        }


        loadSong(
            currentIndex,
            true
        );

    }


    /* =========================================================
       Next
    ========================================================= */

    function nextSong() {

        currentIndex++;


        if (
            currentIndex >=
            songs.length
        ) {

            currentIndex = 0;

        }


        loadSong(
            currentIndex,
            true
        );

    }


    /* =========================================================
       Progress Update
    ========================================================= */

    audio.addEventListener(
        "timeupdate",
        () => {

            if (!audio.duration) {

                return;

            }


            const percent =

                (
                    audio.currentTime /
                    audio.duration
                ) * 100;


            progress.style.width =
                percent + "%";


            time.textContent =

                `${formatTime(
                    audio.currentTime
                )} / ${formatTime(
                    audio.duration
                )}`;

        }
    );


    /* =========================================================
       Seek
    ========================================================= */

    progressContainer.addEventListener(
        "click",
        (event) => {

            if (!audio.duration) {

                return;

            }


            const rect =
                progressContainer
                    .getBoundingClientRect();


            const percent =

                (
                    event.clientX -
                    rect.left
                ) / rect.width;


            audio.currentTime =

                percent *
                audio.duration;

        }
    );


    /* =========================================================
       Volume
    ========================================================= */

    volume.addEventListener(
        "input",
        () => {

            audio.volume =
                Number(volume.value);

        }
    );


    /* =========================================================
       Buttons
    ========================================================= */

    playBtn.addEventListener(
        "click",
        togglePlay
    );


    prevBtn.addEventListener(
        "click",
        previousSong
    );


    nextBtn.addEventListener(
        "click",
        nextSong
    );


    /* =========================================================
       Audio Events
    ========================================================= */

    audio.addEventListener(
        "play",
        updatePlayButton
    );


    audio.addEventListener(
        "pause",
        updatePlayButton
    );


    /* =========================================================
       Auto Next
    ========================================================= */

    audio.addEventListener(
        "ended",
        nextSong
    );


    /* =========================================================
       Keyboard
    ========================================================= */

    document.addEventListener(
        "keydown",
        (event) => {


            /* Space */

            if (
                event.code ===
                "Space"
            ) {

                event.preventDefault();

                togglePlay();

            }


            /* Right */

            if (
                event.code ===
                "ArrowRight"
            ) {

                if (audio.duration) {

                    audio.currentTime =
                        Math.min(
                            audio.currentTime + 5,
                            audio.duration
                        );

                }

            }


            /* Left */

            if (
                event.code ===
                "ArrowLeft"
            ) {

                if (audio.duration) {

                    audio.currentTime =
                        Math.max(
                            audio.currentTime - 5,
                            0
                        );

                }

            }

        }
    );


    /* =========================================================
       Initialize
    ========================================================= */

    audio.volume = 0.8;


    createPlaylist();


    loadSong(
        0,
        false
    );


</script>


</body>

</html>
